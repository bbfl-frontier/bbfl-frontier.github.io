<svg width="70" height="90" viewBox="0 0 70 90" xmlns="http://www.w3.org/2000/svg">
  <!-- Tree trunk -->
  <rect x="28" y="70" width="14" height="20" fill="#4A1B1B" />

  <!-- Tree layers (3 triangles) -->
  <polygon points="35,10 10,35 60,35" fill="#2D5016" />
  <polygon points="35,25 5,50 65,50" fill="#2D5016" />
  <polygon points="35,40 0,70 70,70" fill="#2D5016" />

  <!-- Star on top -->
