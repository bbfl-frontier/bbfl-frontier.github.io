  <circle cx="25" cy="40" r="3" fill="#7B2E2E" />
  <circle cx="45" cy="38" r="3" fill="#7B2E2E" />
  <circle cx="20" cy="55" r="3" fill="#7B2E2E" />
  <circle cx="50" cy="53" r="3" fill="#7B2E2E" />
  <circle cx="35" cy="58" r="3" fill="#7B2E2E" />
</svg>
